<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rayliziie Nime - Streaming Anime</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- HEADER -->
    <header class="navbar">
        <div class="container">
            <div class="logo">🎬 Rayliziie<span>Nime</span></div>
            <nav>
                <a href="#" class="active" data-page="home">Beranda</a>
                <a href="#" data-page="ongoing">Ongoing</a>
                <a href="#" data-page="complete">Completed</a>
                <a href="#" data-page="schedule">Jadwal</a>
            </nav>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari anime..." />
                <button id="searchBtn">🔍</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container" id="mainContent">
        <!-- Akan diisi oleh JavaScript -->
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Rayliziie Nime — Streaming Anime Tanpa Iklan</p>
            <p><small>Powered by <a href="https://github.com/rakarmp/unofficial-otakudesu-api" target="_blank">Unofficial Otakudesu API</a></small></p>
        </div>
    </footer>

    <!-- MODAL DETAIL ANIME -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
